name: 完美校园低电费提醒
on:
  schedule:
    - cron: "0 4,11 * * *"  # 世界协调时，相当于北京时间每天 12 点和 19 点各运行一次
    
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installation dependencies
        run: |
          sudo apt-get update -y  
          sudo apt-get install -y curl jq

      - name: Debug API Response
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          STUDENT_ID: ${{ secrets.STUDENT_ID }}
        run: |
          echo "=== 开始抓取原始返回值 ==="
          curl -s --max-time 15 \
            -H "User-Agent: Mozilla/5.0 (Linux; Android 13; 2211133C) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/110.0.0.0 Mobile Safari/537.36" \
            -H "Referer: https://xqh5.17wanxiao.com/" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "param=%7B%22cmd%22%3A%22getbindroom%22%2C%22account%22%3A%22${STUDENT_ID}%22%7D" \
            -d "customercode=${SCHOOL_ID}" \
            -d "method=getbindroom" \
            "https://xqh5.17wanxiao.com/smartWaterAndElectricityService/SWAEServlet" | head -c 2000
          echo ""
          echo "=== 抓取结束 ==="
          
      - name: Run main.sh
        env:
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          STUDENT_ID: ${{ secrets.STUDENT_ID }}
          ALERT_QQ: ${{ secrets.ALERT_QQ }}
          ALERT_THRESHOLD: ${{ vars.ALERT_THRESHOLD }}
        run: |
          bash ./main.sh
